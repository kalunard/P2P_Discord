<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Voice Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <h1>P2P Voice Chat</h1>

    <!-- Панель комнаты -->
    <div class="room-panel">
      <div class="room-info">
        <span>Комната:</span>
        <strong id="roomLabel">—</strong>
      </div>

      <div class="room-actions">
        <button id="createRoomBtn">Создать комнату</button>
        <input id="roomInput" type="text" placeholder="Введите ID комнаты" />
        <button id="joinRoomBtn">Подключиться</button>
      </div>

      <div class="room-actions">
        <button id="copyLinkBtn">Скопировать ссылку</button>
        <button id="hangupBtn" class="danger" disabled>Отключиться</button>
      </div>
    </div>

    <!-- Видео собеседника -->
    <div class="media">
      <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline muted></video>
        <div id="remotePlaceholder">Удаленное видео появится здесь</div>
      </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <!-- Управление звуком -->
    <div class="audio-controls">
      <label>
        Микрофон:
        <input type="range" id="micVolume" min="0" max="2" step="0.1" value="1" />
      </label>
      <label><input type="checkbox" id="micMuted" /> Мьют микрофона</label>
      <label><input type="checkbox" id="deafen" /> Заглушить всех (Deafen)</label>
      <div class="level-meter">
        <div id="micLevelBar"></div>
      </div>
    </div>

    <!-- Демонстрация экрана -->
    <div class="screen-share">
      <button id="shareScreenBtn">Показать экран</button>
      <button id="stopShareBtn" disabled>Остановить</button>
      <label><input type="checkbox" id="shareAudio" checked /> Со звуком</label>
    </div>

    <div id="status">Статус: отключено</div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
